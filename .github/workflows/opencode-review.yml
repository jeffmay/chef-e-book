name: opencode-review

on:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull Request ID
        required: true
        type: number

jobs:
  review:
    if: |
      github.event_name == 'pull_request' && !github.event.pull_request.draft ||
      github.event_name == 'issue_comment' && contains(github.event.comment.body, '/review') ||
      github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '/review') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false
          fetch-depth: 0

      # Comment-triggered runs start on the default branch; switch to PR head
      # so opencode reads the PR's code.
      - if: github.event_name == 'issue_comment'
        run: gh pr checkout "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY"

      # Manual dispatch runs also start on default branch; switch to PR head
      - if: github.event_name == 'workflow_dispatch'
        run: |
          gh pr checkout "${{ github.event.inputs.pull_request }}" --repo "$GITHUB_REPOSITORY"

      - uses: Barmore-Genc/opencode-pr-reviewer@v1
        with:
          model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
          pr-number: ${{ github.event.inputs.pull_request || github.event.pull_request.number || github.event.issue.number }}
          user-comment: ${{ github.event.inputs.pull_request && 'Manual review triggered via workflow_dispatch' || github.event.comment.body }}
